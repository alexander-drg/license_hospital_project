<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Medijobs AI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #f5f4f0;
      --surface:   #ffffff;
      --border:    #e2e0d9;
      --ink:       #1a1916;
      --ink-muted: #6b6860;
      --accent:    #1a5c3a;
      --accent-lt: #e8f4ee;
      --accent-mid:#2d7a52;
      --danger:    #c0392b;
      --warn:      #b7600a;
      --radius:    14px;
      --shadow:    0 2px 12px rgba(0,0,0,.07);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── NAV ── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 32px;
      display: flex;
      align-items: center;
      height: 60px;
      gap: 32px;
    }
    .nav-brand {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: -.3px;
    }
    .nav-brand span { color: var(--accent); }
    .nav-links { display: flex; gap: 4px; margin-left: auto; }
    .nav-links a {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink-muted);
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 8px;
      transition: background .15s, color .15s;
    }
    .nav-links a:hover { background: var(--accent-lt); color: var(--accent); }

    /* ── MAIN CONTENT ── */
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 24px;
    }

    /* ── PAGE TITLE ── */
    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      letter-spacing: -.5px;
      margin-bottom: 6px;
    }
    .page-subtitle {
      font-size: 14px;
      color: var(--ink-muted);
      margin-bottom: 28px;
    }

    /* ── CARD ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    /* ── BUTTONS ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 9px;
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all .15s;
      text-decoration: none;
    }
    .btn-primary   { background: var(--accent);    color: #fff; }
    .btn-primary:hover { background: var(--accent-mid); }
    .btn-ghost     { background: transparent; color: var(--ink-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg); color: var(--ink); }
    .btn-danger    { background: #fdf0ef; color: var(--danger); border: 1px solid #f5c8c5; }
    .btn-danger:hover { background: #fbe4e2; }
    .btn-ai        { background: var(--accent-lt); color: var(--accent); border: 1px solid #c0dece; }
    .btn-ai:hover  { background: #d4ece0; }
    .btn-sm        { padding: 5px 11px; font-size: 12px; }

    /* ── BADGE ── */
    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
    }
    .badge-green  { background: var(--accent-lt); color: var(--accent); }
    .badge-red    { background: #fdf0ef; color: var(--danger); }
    .badge-amber  { background: #fef3e2; color: var(--warn); }
    .badge-gray   { background: #f0efec; color: var(--ink-muted); }

    /* ── TAG ── */
    .tag {
      display: inline-block;
      background: #f0efec;
      color: var(--ink-muted);
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      margin: 2px;
    }
    .tag-accent { background: var(--accent-lt); color: var(--accent); }

    /* ── DIVIDER ── */
    hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

    /* ── SECTION HEADER ── */
    .section-header {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      margin: 32px 0 14px;
      letter-spacing: -.3px;
    }

    /* ── AI RESULT BLOCKS ── */
    .ai-section h4 {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .6px;
      color: var(--ink-muted);
      margin-bottom: 8px;
    }
    .ai-list { padding-left: 18px; font-size: 14px; line-height: 1.7; }

    /* ── FIT BAR ── */
    .fit-bar-track { height: 6px; background: var(--border); border-radius: 3px; margin: 6px 0; }
    .fit-bar-fill  { height: 6px; border-radius: 3px; transition: width .4s ease; }

    /* ── ANIMATIONS ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .animate-in { animation: fadeUp .35s ease both; }
  </style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/">Medi<span>jobs</span> AI</a>
  <div class="nav-links">
    <a href="/">Candidates</a>
  </div>
</nav>

<main>
  {% block content %}{% endblock %}
</main>

</body>
</html>
