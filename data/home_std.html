{% extends "base.html" %}
{% block content %}
<h2>Candidates</h2>
<form action="/upload" method="post" enctype="multipart/form-data" style="margin:16px 0">
  <input type="file" name="cv" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" required>
  <button type="submit">Upload CV</button>
</form>

<ul>
  {% for c in candidates %}
    <li><a href="/candidate/{{c.id}}">{{c.name}}</a> — {{c.specialization}} ({{c.years_exp}}y)</li>
  {% endfor %}
</ul>
{% endblock %}
